<form
  class="theme-form theme-form-2 mega-form"
  [formGroup]="editor.form"
  (ngSubmit)="editor.submit()"
>
  <div class="vertical-tabs category-form">
    <div class="row g-4">
      <div class="col-xl-3 col-lg-4">
        <ul
          ngbNav
          #nav="ngbNav"
          [(activeId)]="editor.activeTab"
          class="nav-pills"
          orientation="vertical"
        >
          <li ngbNavItem="general">
            <button ngbNavLink type="button">
              <i class="ri-settings-3-line"></i> Umum</button
            ><ng-template ngbNavContent>
              <app-product-general-tab />
            </ng-template>
          </li>
          <li ngbNavItem="content">
            <button ngbNavLink type="button">
              <i class="ri-translate-2"></i> Konten & Bahasa</button
            ><ng-template ngbNavContent>
              <app-product-content-tab />
            </ng-template>
          </li>
          <li ngbNavItem="channels">
            <button ngbNavLink type="button">
              <i class="ri-price-tag-3-line"></i> Harga & Kanal</button
            ><ng-template ngbNavContent>
              <app-product-channels-tab />
            </ng-template>
          </li>
          <li ngbNavItem="media">
            <button ngbNavLink type="button">
              <i class="ri-image-line"></i> Media</button
            ><ng-template ngbNavContent>
              <app-product-media-tab />
            </ng-template>
          </li>
          <li ngbNavItem="seo">
            <button ngbNavLink type="button">
              <i class="ri-search-eye-line"></i> SEO</button
            ><ng-template ngbNavContent>
              <app-product-seo-tab />
            </ng-template>
          </li>
        </ul>
      </div>
      <div class="col-xl-9 col-lg-8"><div [ngbNavOutlet]="nav"></div></div>
    </div>
  </div>
</form>
