<section class="category-panel">
  <div class="category-heading">
    <h5>SEO & tampilan saat dibagikan</h5>
    <p>Opsional; nama dan ringkasan produk menjadi nilai bawaan.</p>
  </div>
  <div class="category-language-tabs">
    <button
      type="button"
      [class.active]="editor.activeLocale === 'id'"
      (click)="editor.activeLocale = 'id'"
    >
      <strong>ID</strong> Bahasa Indonesia</button
    ><button
      type="button"
      [class.active]="editor.activeLocale === 'en'"
      (click)="editor.activeLocale = 'en'"
    >
      <strong>EN</strong> English
    </button>
  </div>
  @if (editor.activeLocale === 'id') {
    <div class="row g-4">
      <div class="col-md-6">
        <label class="form-label"
          >Judul SEO <app-help-tip section="tab-seo--judul-seo" /></label
        ><input class="form-control" formControlName="id_meta_title" />
      </div>
      <div class="col-md-6">
        <label class="form-label"
          >Canonical URL
          <app-help-tip section="tab-seo--canonical-url" /></label
        ><input class="form-control" formControlName="id_canonical_url" />
      </div>
      <div class="col-12">
        <div class="field-heading">
          <label class="form-label"
            >Deskripsi SEO <app-help-tip section="tab-seo--deskripsi-seo"
          /></label>
          <app-ai-field-action
            label="Isi deskripsi SEO otomatis"
            loadingLabel="Sedang menyiapkan deskripsi SEO…"
            [loading]="assistant.assistingField === 'id_meta_description'"
            [disabled]="assistant.assistingField !== null"
            (requested)="assistant.assistProductField('id', 'meta_description')"
          />
        </div>
        <textarea
          rows="3"
          class="form-control"
          formControlName="id_meta_description"
        ></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label"
          >Judul OG
          <app-help-tip section="tab-seo--judul-dan-deskripsi-og" /></label
        ><input class="form-control" formControlName="id_og_title" />
      </div>
      <div class="col-md-6">
        <div class="field-heading">
          <label class="form-label">Deskripsi OG</label>
          <app-ai-field-action
            label="Isi deskripsi otomatis"
            [loading]="assistant.assistingField === 'id_og_description'"
            [disabled]="assistant.assistingField !== null"
            (requested)="assistant.assistProductField('id', 'og_description')"
          />
        </div>
        <textarea
          rows="2"
          class="form-control"
          formControlName="id_og_description"
        ></textarea>
      </div>
    </div>
  } @else {
    <div class="row g-4">
      <div class="col-md-6">
        <label class="form-label"
          >SEO title <app-help-tip section="tab-seo--judul-seo" /></label
        ><input class="form-control" formControlName="en_meta_title" />
      </div>
      <div class="col-md-6">
        <label class="form-label"
          >Canonical URL
          <app-help-tip section="tab-seo--canonical-url" /></label
        ><input class="form-control" formControlName="en_canonical_url" />
      </div>
      <div class="col-12">
        <div class="field-heading">
          <label class="form-label"
            >SEO description <app-help-tip section="tab-seo--deskripsi-seo"
          /></label>
          <app-ai-field-action
            label="Translate Indonesian description"
            loadingLabel="Translating the SEO description…"
            icon="ri-translate-2"
            [loading]="assistant.assistingField === 'en_meta_description'"
            [disabled]="
              assistant.assistingField !== null ||
              !form.controls.id_meta_description.value
            "
            (requested)="assistant.translateProductField('meta_description')"
          />
        </div>
        <textarea
          rows="3"
          class="form-control"
          formControlName="en_meta_description"
        ></textarea>
      </div>
      <div class="col-12 col-md-12">
        <label class="form-label"
          >OG title
          <app-help-tip section="tab-seo--judul-dan-deskripsi-og" /></label
        ><input class="form-control" formControlName="en_og_title" />
      </div>
      <div class="col-12 col-md-12">
        <div class="field-heading">
          <label class="form-label">OG description</label>
          <app-ai-field-action
            label="Translate Indonesian description"
            loadingLabel="Translating the sharing description…"
            icon="ri-translate-2"
            [loading]="assistant.assistingField === 'en_og_description'"
            [disabled]="
              assistant.assistingField !== null ||
              !form.controls.id_og_description.value
            "
            (requested)="assistant.translateProductField('og_description')"
          />
        </div>
        <textarea
          rows="2"
          class="form-control"
          formControlName="en_og_description"
        ></textarea>
      </div>
    </div>
  }
  <div class="category-actions">
    <button
      type="button"
      class="btn btn-outline"
      (click)="editor.setTab('media')"
    >
      <i class="ri-arrow-left-line"></i> Kembali</button
    ><app-button [id]="'product_btn'">{{
      editor.type() === 'edit' ? 'Perbarui Produk' : 'Simpan Produk'
    }}</app-button>
  </div>
</section>
