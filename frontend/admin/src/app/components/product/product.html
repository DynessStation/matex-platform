<app-page-wrapper [gridClass]="'col-sm-12'" [title]="'products'">
  <div button class="d-flex flex-wrap gap-2">
    @if (!ordering) {
      <button
        *hasPermission="'product.update'"
        type="button"
        id="open_product_front"
        class="align-items-center btn btn-outline-primary d-flex gap-1"
        (click)="openFront()"
      >
        <i class="ri-drag-move-2-line"></i>
        Produk di depan
      </button>
    }
    <a
      *hasPermission="'product.create'"
      [routerLink]="['/product/create']"
      class="align-items-center btn btn-theme d-flex"
    >
      <i class="ri-add-line"></i> {{ 'add_product' | translate }}
    </a>
  </div>
  @if (ordering) {
    <app-order-list
      title="Produk di depan katalog"
      hint="Produk ini tampil paling depan di katalog website, sesuai urutan di bawah. Produk lain menyusul dari yang terbaru. Tambah produk dengan mencentang Tampilkan di depan katalog di form produk."
      help="produk-di-depan"
      emptyText="Belum ada produk di depan katalog. Centang Tampilkan di depan katalog di form produk."
      [items]="orderItems"
      [removable]="true"
      [max]="orderMax"
      [saving]="savingOrder"
      (save)="saveFront($event)"
      (cancel)="ordering = false"
    />
  }
  <div class="row g-4 product-list-layout" [hidden]="ordering">
    <aside class="col-xl-3 col-lg-4" *hasPermission="'product_category.view'">
      <app-product-category-filter
        [selected]="selectedCategory"
        [totalAll]="tableConfig.total_all"
        (selectCategory)="selectCategory($event)"
      />
    </aside>
    <div class="col">
      <app-table
        [tableConfig]="tableConfig"
        [hasCheckbox]="false"
        [emitInitialChange]="false"
        (tableChanged)="onTableChange($event)"
        (action)="onActionClicked($event)"
      />
    </div>
  </div>
</app-page-wrapper>
