<app-page-wrapper
  [gridClass]="'col-sm-12'"
  [title]="'cms_page.trash_title' | translate"
>
  <div button>
    <a
      [routerLink]="['/cms-page']"
      class="align-items-center btn btn-light-bg d-flex"
    >
      <i class="ri-arrow-left-line me-1"></i>

      {{ 'cms_page.back_to_list' | translate }}
    </a>
  </div>

  <div class="alert alert-light border mb-4">
    <i class="ri-information-line me-1"></i>

    {{ 'cms_page.trash_help' | translate }}
  </div>

  <app-table
    [tableConfig]="tableConfig"
    [hasCheckbox]="false"
    [actionMode]="'dropdown'"
    [externalPermissions]="(authPermissions$ | async) ?? []"
    [externalAllAccess]="(isAllAccess$ | async) ?? false"
    (tableChanged)="onTableChange($event)"
    (action)="onActionClicked($event)"
  />
</app-page-wrapper>

<app-confirmation-modal #confirmationModal (confirmed)="onConfirmed($event)" />
