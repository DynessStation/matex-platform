<app-page-wrapper [gridClass]="'col-12'" [title]="'media_ui.title'">
  <!--==================================================
  ==== BULK ACTION
  ==================================================-->

  <div option class="selected-options" *hasPermission="'attachment.delete'">
    @if (images.length > 0) {
      <ul>
        <li>
          {{ 'media_ui.selected' | translate }}
          ({{ images.length }})
        </li>

        <li>
          <a
            href="javascript:void(0)"
            (click)="DeleteModal()?.openModal('deleteAll', [])"
          >
            <i class="ri-delete-bin-line"></i>
          </a>
        </li>
      </ul>
    }
  </div>

  <!--==================================================
  ==== ADD MEDIA
  ==================================================-->

  <div button>
    <a
      *hasPermission="'attachment.create'"
      (click)="MediaModal()?.openModal()"
      class="align-items-center btn btn-theme d-flex"
    >
      <i class="ri-add-line"></i>

      {{ 'media_ui.add_media' | translate }}
    </a>
  </div>

  <!--==================================================
  ==== MEDIA BOX
  ==================================================-->

  <app-media-box
    #mediaBox
    [selectedImages]="images"
    [multiple]="true"
    (setDeleteImage)="deleteImage($event)"
    (setImage)="selectImage($event)"
  />
</app-page-wrapper>

<!--==================================================
==== UPLOAD MODAL
==================================================-->

<app-media-modal
  [selectMedia]="false"
  [multipleImage]="true"
  [accept]="mediaAccept"
  [collection]="'media_library'"
  (uploadCompleted)="mediaBox.getAttachments()"
  #mediaModal
/>

<!--==================================================
==== BULK DELETE MODAL
==================================================-->

<app-delete-modal
  #deleteModal
  (deleteItem)="onActionClicked($event.actionToPerform)"
/>
