<form
  class="theme-form theme-form-2 mega-form admin-account-form"
  [formGroup]="account.form"
  (ngSubmit)="account.submit()"
>
  <app-admin-account-profile-section />

  <app-admin-account-contact-section />

  <app-admin-account-placement-section />

  @if (mode() === 'create') {
    <app-admin-account-password-section />
  }

  <!--==================================================-->
  <!--==== SUBMIT =======================================-->
  <!--==================================================-->

  <div class="form-submit-wrapper">
    <app-button [id]="'admin_account_submit_btn'" [class]="'btn btn-theme'">
      {{
        (mode() === 'create' ? 'admin_account.create' : 'admin_account.update')
          | translate
      }}
    </app-button>
  </div>
</form>
