<app-insight-panel>
  <app-insight-column
    headingKey="article_insight.top"
    [range]="topRange()"
    (rangeChange)="topRange.set($event)"
  >
    <button
      insightAction
      type="button"
      class="insight-action"
      data-testid="insight-top-tags"
      (click)="openTags()"
    >
      {{ 'article_insight.top_tags' | translate }}
    </button>
    <app-insight-rank [items]="top()" [loading]="topLoading()" />
  </app-insight-column>

  <app-insight-column
    headingKey="article_insight.chart"
    [range]="chartRange()"
    (rangeChange)="chartRange.set($event)"
  >
    <div class="insight-chart-row">
      <app-insight-line [labels]="chartLabels()" [series]="series()" />
      @if (audit(); as data) {
        <div class="insight-score" data-testid="insight-score">
          <small>{{ 'article_insight.score' | translate }}</small>
          <strong>{{ data.score }}</strong>
          @if (data.score_change !== 0) {
            <em
              >{{ data.score_change > 0 ? '+' : '' }}{{ data.score_change }}</em
            >
          }
          <small>{{ scoreLabel() }}</small>
        </div>
      }
    </div>
  </app-insight-column>

  <app-insight-column headingKey="article_insight.audit" [showRange]="false">
    <app-insight-audit
      [totalLabel]="'article_insight.total' | translate"
      [total]="audit()?.total ?? 0"
      [segments]="segments()"
      [checks]="checks()"
    />
  </app-insight-column>
</app-insight-panel>
