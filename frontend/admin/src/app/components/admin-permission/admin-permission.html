<app-page-wrapper
  [gridClass]="'col-sm-12'"
  [title]="'admin_permission.title' | translate"
>
  <!--==================================================
  ==== CREATE BUTTON
  ==================================================-->

  <div
    button
    class="d-flex flex-wrap gap-2"
    *hasPermission="'admin_permission.create'"
  >
    <a
      [routerLink]="['/admin-permission/create']"
      class="align-items-center btn btn-theme"
    >
      <i class="ri-add-line"></i>

      {{ 'admin_permission.add' | translate }}
    </a>
  </div>

  <!--==================================================
  ==== TABLE
  ==================================================-->

  <app-table
    [tableConfig]="tableConfig"
    [hasCheckbox]="false"
    [actionMode]="'dropdown'"
    [externalPermissions]="(authPermissions$ | async) ?? []"
    [externalAllAccess]="(isAllAccess$ | async) ?? false"
    (tableChanged)="onTableChange($event)"
    (action)="onActionClicked($event)"
  />
</app-page-wrapper>

<!--==================================================
==== CONFIRMATION
==================================================-->

<app-confirmation-modal #confirmationModal (confirmed)="onConfirmed($event)" />
