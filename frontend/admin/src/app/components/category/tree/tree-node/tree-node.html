<li
  class="cursor-pointer"
  [class.category-drag-over]="dragOver"
  [class.inside-ul]="children.length"
  (dragover)="allowDrop($event)"
  (dragleave)="leaveDrop()"
  (drop)="dropBefore($event)"
>
  <div>
    <button
      type="button"
      class="category-drag-handle"
      draggable="true"
      [disabled]="savingOrder || reorderDisabled()"
      aria-label="Geser untuk mengubah urutan kategori"
      title="Geser untuk mengubah urutan"
      (dragstart)="startDrag($event)"
    >
      <i class="ri-draggable"></i>
    </button>
    @if (children.length) {
      <i
        class="ri-arrow-down-s-line"
        (click)="showChildrenNode = !showChildrenNode"
      ></i>
    }
    <span
      class="category-node-name"
      [class.active]="node().id === id"
      [class.disabled]="node().status !== 'published'"
      >{{ label }}</span
    >
    <span class="category-node-meta">
      @if (node().status === 'draft') {
        <span class="badge category-node-state">Draft</span>
      } @else if (node().status === 'archived') {
        <span class="badge category-node-state">Diarsipkan</span>
      }
      <small
        class="category-node-count"
        [title]="node().product_count + ' produk memakai kategori ini'"
        >{{ node().product_count ?? 0 }} produk</small
      >
    </span>
    <div class="tree-options">
      <a
        href="javascript:void(0)"
        *hasPermission="'product_category.update'"
        [routerLink]="[
          node().type === 'post' ? '/blog/category/edit' : '/category/edit',
          node()?.id,
        ]"
      >
        <i class="ri-pencil-line text-success"></i>
      </a>
      <a
        href="javascript:void(0)"
        *hasPermission="'product_category.delete'"
        (click)="DeleteModal().openModal('delete', node())"
      >
        <i class="ri-delete-bin-7-line text-danger"></i>
      </a>
    </div>
    <i class="tree-icon file-icon" role="presentation"></i>
  </div>

  @if (children.length && showChildrenNode) {
    <ul>
      @for (child of children; track child.id) {
        <app-tree-node
          [node]="child"
          [siblings]="children"
          [reorderDisabled]="reorderDisabled()"
          [displayKey]="displayKey()"
          [recursionKey]="recursionKey()"
          [categoryType]="categoryType()"
        />
      }
    </ul>
  }
</li>

<!-- Delete Modal -->
<app-delete-modal
  #deleteModal
  (deleteItem)="delete($event.actionToPerform, $event.data)"
/>
