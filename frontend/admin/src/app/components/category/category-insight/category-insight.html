<app-insight-panel>
  <app-insight-column
    headingKey="category_insight.top"
    [range]="topRange()"
    (rangeChange)="topRange.set($event)"
  >
    <app-insight-rank [items]="top()" />
  </app-insight-column>
  <app-insight-column
    headingKey="category_insight.products_per"
    [showRange]="false"
  >
    <app-insight-rank [items]="products()" />
  </app-insight-column>
  <app-insight-column headingKey="category_insight.audit" [showRange]="false">
    <app-insight-audit
      [totalLabel]="'category_insight.total' | translate"
      [total]="audit()?.total ?? 0"
      [segments]="segments()"
      [checks]="checks()"
    />
  </app-insight-column>
</app-insight-panel>
