<form
  class="theme-form theme-form-2 mega-form office-form"
  [formGroup]="office.form"
  (ngSubmit)="office.submit()"
>
  <ul
    ngbNav
    #nav="ngbNav"
    [(activeId)]="office.activeTab"
    class="nav-tabs office-nav"
  >
    <li [ngbNavItem]="'general'">
      <button ngbNavLink type="button">
        {{ 'office.general' | translate }}
        <app-tab-status [state]="tabStates().general" />
      </button>

      <ng-template ngbNavContent>
        <app-office-general-tab />
      </ng-template>
    </li>

    <li [ngbNavItem]="'location'">
      <button ngbNavLink type="button">
        {{ 'office.location' | translate }}
        <app-tab-status [state]="tabStates().location" />
      </button>

      <ng-template ngbNavContent>
        <app-office-location-tab />
      </ng-template>
    </li>

    <li [ngbNavItem]="'contact'">
      <button ngbNavLink type="button">
        {{ 'office.contact' | translate }}
        <app-tab-status [state]="tabStates().contact" />
      </button>

      <ng-template ngbNavContent>
        <app-office-contact-tab />
      </ng-template>
    </li>

    <li [ngbNavItem]="'hours'">
      <button ngbNavLink type="button">
        {{ 'office.operating_hours' | translate }}
        <app-tab-status [state]="tabStates().hours" />
      </button>

      <ng-template ngbNavContent>
        <app-office-hours-tab />
      </ng-template>
    </li>

    <li *hasPermission="'attachment.view'" [ngbNavItem]="'media'">
      <button ngbNavLink type="button">{{ 'office.media' | translate }}</button>

      <ng-template ngbNavContent>
        <app-office-media-tab />
      </ng-template>
    </li>

    <li [ngbNavItem]="'publication'">
      <button ngbNavLink type="button">
        {{ 'office.publication' | translate }}
        <app-tab-status [state]="tabStates().publication" />
      </button>

      <ng-template ngbNavContent>
        <app-office-publication-tab />
      </ng-template>
    </li>
  </ul>

  <div [ngbNavOutlet]="nav" class="office-tab-content"></div>

  <div class="office-form-footer">
    <app-button
      [id]="'office_submit_btn'"
      [type]="'submit'"
      [class]="'btn btn-theme'"
    >
      {{
        (office.mode() === 'create' ? 'office.create' : 'office.update')
          | translate
      }}
    </app-button>
  </div>
</form>
