<div class="office-switch-row mb-4">
  <label class="switch">
    <input id="is_public" type="checkbox" formControlName="is_public" />

    <span class="switch-state"></span>
  </label>

  <label class="office-switch-label" for="is_public">
    {{ 'office.show_publicly' | translate }}
    <app-help-tip section="tab-publikasi--tampilkan-kantor-ini-secara-publik" />
  </label>
</div>

@if (form.controls.is_public.value) {
  <div class="row g-4">
    <div class="col-md-8">
      <label class="form-label">
        {{ 'office.public_slug' | translate }}
        <app-help-tip section="tab-publikasi--slug-publik" />
      </label>

      <input
        class="form-control"
        formControlName="public_slug"
        placeholder="kantor-pusat-bogor"
      />
    </div>

    <div class="col-md-4">
      <label class="form-label" for="public_position">
        {{ 'office.sort_order' | translate }}
        <app-help-tip section="tab-publikasi--urutan" />
      </label>

      <input
        id="public_position"
        class="form-control"
        readonly
        tabindex="-1"
        [value]="position"
      />
    </div>
  </div>
}

<hr class="my-4" />

<div class="row g-4">
  <div class="col-12">
    <label class="form-label">
      {{ 'office.google_place_id' | translate }}
      <app-help-tip
        section="tab-publikasi--google-place-id-dan-url-google-maps"
      />
    </label>

    <input class="form-control" formControlName="google_place_id" readonly />
  </div>

  <div class="col-12">
    <label class="form-label">
      {{ 'office.google_maps_url' | translate }}
    </label>

    <input class="form-control" formControlName="google_maps_url" readonly />
  </div>
</div>
