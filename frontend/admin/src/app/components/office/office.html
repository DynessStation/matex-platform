<app-page-wrapper
  [gridClass]="'col-sm-12'"
  [title]="'office.title' | translate"
>
  <div button class="d-flex flex-wrap gap-2">
    @if (!ordering) {
      <button
        *hasPermission="'office.update'"
        type="button"
        id="open_office_order"
        class="align-items-center btn btn-outline-primary d-flex gap-1"
        (click)="openOrder()"
      >
        <i class="ri-drag-move-2-line"></i>
        Atur urutan
      </button>
    }
    <a
      *hasPermission="'office.create'"
      [routerLink]="['/office/create']"
      class="align-items-center btn btn-theme"
    >
      <i class="ri-add-line"></i>

      {{ 'office.add' | translate }}
    </a>
  </div>

  @if (ordering) {
    <app-order-list
      title="Atur urutan kantor publik"
      hint="Hanya kantor publik. Urutan ini dipakai di halaman Kontak dan footer website."
      help="atur-urutan"
      emptyText="Belum ada kantor publik. Aktifkan Tampilkan di website pada tab Publikasi."
      [items]="orderItems"
      [saving]="savingOrder"
      (save)="saveOrder($event)"
      (cancel)="ordering = false"
    />
  }

  <app-table
    [hidden]="ordering"
    [tableConfig]="tableConfig"
    [hasCheckbox]="false"
    [externalPermissions]="(authPermissions$ | async) ?? []"
    [externalAllAccess]="(isAllAccess$ | async) ?? false"
    (tableChanged)="onTableChange($event)"
    (action)="onActionClicked($event)"
  />
</app-page-wrapper>

<app-confirmation-modal #confirmationModal (confirmed)="onConfirmed($event)" />
