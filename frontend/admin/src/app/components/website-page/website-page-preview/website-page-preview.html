<div class="cms-preview">
  <!--==================================================-->
  <!--==== TOOLBAR =====================================-->
  <!--==================================================-->

  <div class="cms-preview-toolbar">
    <div>
      <h5 class="mb-1">
        {{ 'website_page.preview' | translate }}
      </h5>

      <small class="text-muted">
        {{ 'website_page.preview_internal_notice' | translate }}
      </small>
    </div>

    <div class="cms-preview-controls">
      <!-- LOCALE -->

      <div class="d-flex flex-wrap gap-1">
        @for (
          translation of page.translations;
          track translation.website_page_locale
        ) {
          <button
            type="button"
            class="btn btn-sm d-flex align-items-center gap-2"
            [class.btn-theme]="
              selectedLocale === translation.website_page_locale
            "
            [class.btn-light-bg]="
              selectedLocale !== translation.website_page_locale
            "
            (click)="selectLocale(translation.website_page_locale)"
          >
            <strong>
              {{ translation.website_page_locale === 'id-ID' ? 'ID' : 'EN' }}
            </strong>

            <span>
              {{
                (translation.website_page_locale === 'id-ID'
                  ? 'website_page.language_indonesian'
                  : 'website_page.language_english'
                ) | translate
              }}
            </span>

            <span
              class="badge"
              [class.bg-success]="translation.website_page_i18n_status === 1"
              [class.bg-secondary]="translation.website_page_i18n_status !== 1"
            >
              {{
                (translation.website_page_i18n_status === 1
                  ? 'website_page.translation_published'
                  : 'website_page.translation_draft'
                ) | translate
              }}
            </span>
          </button>
        }
      </div>

      <!-- VIEWPORT -->

      <div class="btn-group">
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-theme]="viewport === 'fit'"
          [class.btn-light-bg]="viewport !== 'fit'"
          (click)="setViewport('fit')"
          [title]="'website_page.preview_fit' | translate"
        >
          <i class="ri-layout-line"></i>
        </button>

        <button
          type="button"
          class="btn btn-sm"
          [class.btn-theme]="viewport === 'desktop'"
          [class.btn-light-bg]="viewport !== 'desktop'"
          (click)="setViewport('desktop')"
          [title]="'website_page.preview_desktop' | translate"
        >
          <i class="ri-computer-line"></i>
        </button>

        <button
          type="button"
          class="btn btn-sm"
          [class.btn-theme]="viewport === 'tablet'"
          [class.btn-light-bg]="viewport !== 'tablet'"
          (click)="setViewport('tablet')"
          [title]="'website_page.preview_tablet' | translate"
        >
          <i class="ri-tablet-line"></i>
        </button>

        <button
          type="button"
          class="btn btn-sm"
          [class.btn-theme]="viewport === 'mobile'"
          [class.btn-light-bg]="viewport !== 'mobile'"
          (click)="setViewport('mobile')"
          [title]="'website_page.preview_mobile' | translate"
        >
          <i class="ri-smartphone-line"></i>
        </button>
      </div>
    </div>
  </div>

  <!--==================================================-->
  <!--==== FRAME =======================================-->
  <!--==================================================-->

  <div class="cms-preview-stage">
    <div class="cms-preview-device" [style.width]="viewportWidth">
      @if (previewUrl) {
        <iframe
          class="cms-preview-frame"
          [src]="previewUrl"
          sandbox
          referrerpolicy="no-referrer"
          [attr.title]="'website_page.preview_frame_title' | translate"
        ></iframe>
      }
    </div>
  </div>
</div>
