<app-page-wrapper
  [gridClass]="'col-sm-12'"
  [title]="'faq_admin.title' | translate"
>
  <div button class="d-flex flex-wrap gap-2">
    <a
      *hasPermission="'website_page.update'"
      routerLink="/website-page/faq"
      class="align-items-center btn btn-outline-primary d-flex gap-1"
    >
      <i class="ri-settings-3-line"></i>
      {{ 'page_settings_seo' | translate }}
    </a>
    @if (!ordering) {
      <button
        *hasPermission="'faq.update'"
        type="button"
        id="open_faq_order"
        class="align-items-center btn btn-outline-primary d-flex gap-1"
        (click)="openOrder()"
      >
        <i class="ri-drag-move-2-line"></i>
        Atur urutan
      </button>
    }
    <a
      *hasPermission="'faq.create'"
      [routerLink]="['/faq/create']"
      class="align-items-center btn btn-theme d-flex gap-1"
    >
      <i class="ri-add-line"></i> {{ 'add_faq' | translate }}
    </a>
  </div>
  @if (ordering) {
    <app-order-list
      title="Atur urutan FAQ"
      hint="Urutan ini dipakai di halaman FAQ website. Geser baris atau pakai panah, lalu simpan."
      help="atur-urutan"
      [items]="orderItems"
      [saving]="savingOrder"
      (save)="saveOrder($event)"
      (cancel)="ordering = false"
    />
  }
  <!-- Kept (hidden) while ordering, so the table keeps its search and page. -->
  <app-table
    [hidden]="ordering"
    [tableConfig]="tableConfig"
    [hasCheckbox]="true"
    (tableChanged)="onTableChange($event)"
    (action)="onActionClicked($event)"
  />
</app-page-wrapper>
