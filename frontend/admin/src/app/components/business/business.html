<app-page-wrapper [gridClass]="'col-sm-12'" [title]="'business_entities'">
  <ul
    ngbNav
    #nav="ngbNav"
    class="nav-tabs costing-nav"
    [activeId]="tab()"
    (activeIdChange)="setTab($event)"
  >
    <li ngbNavItem="entities">
      <button ngbNavLink type="button" data-testid="business-tab-entities">
        Entitas
      </button>
      <ng-template ngbNavContent><app-business-entities /></ng-template>
    </li>
    <li ngbNavItem="stores">
      <button ngbNavLink type="button" data-testid="business-tab-stores">
        Toko
      </button>
      <ng-template ngbNavContent><app-business-stores /></ng-template>
    </li>
    <li ngbNavItem="rules">
      <button ngbNavLink type="button" data-testid="business-tab-rules">
        Bagi hasil
      </button>
      <ng-template ngbNavContent><app-business-rules /></ng-template>
    </li>
  </ul>
  <div [ngbNavOutlet]="nav" class="costing-content"></div>
</app-page-wrapper>
