<div class="modal-header">
  <h5 class="modal-title">{{ item()?.name || 'Item HPP' }}</h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Tutup"
    (click)="modal.close()"
  ></button>
</div>
<div class="modal-body costing-modal" data-testid="costing-modal">
  @if (item()?.product_id; as productId) {
    <a
      class="costing-text-link"
      data-testid="item-open-product"
      [routerLink]="['/product/edit', productId]"
      [queryParams]="{ tab: 'channels' }"
      (click)="modal.close()"
    >
      <i class="ri-external-link-line"></i> Buka di form produk
    </a>
  }
  <div class="row g-3 mb-2">
    <div class="col-md-5">
      <label class="form-label">Nama</label>
      <input
        class="form-control"
        data-testid="item-name"
        [(ngModel)]="form.name"
      />
    </div>
    <div class="col-md-4">
      <label class="form-label">Kelompok</label>
      <input class="form-control" [(ngModel)]="form.group" />
    </div>
    <div class="col-md-3">
      <label class="form-label">SKU produk</label>
      <input
        class="form-control"
        data-testid="item-sku"
        [(ngModel)]="form.sku"
      />
    </div>
    <div class="col-md-3 col-4">
      <label class="form-label">L (cm)</label>
      <input
        appLocalizedNumber
        [decimals]="2"
        class="form-control"
        inputmode="decimal"
        [(ngModel)]="form.width"
      />
    </div>
    <div class="col-md-3 col-4">
      <label class="form-label">P (cm)</label>
      <input
        appLocalizedNumber
        [decimals]="2"
        class="form-control"
        inputmode="decimal"
        [(ngModel)]="form.length"
      />
    </div>
    <div class="col-md-3 col-4">
      <label class="form-label">T (cm)</label>
      <input
        appLocalizedNumber
        [decimals]="2"
        class="form-control"
        inputmode="decimal"
        [(ngModel)]="form.height"
      />
    </div>
    <div *hasPermission="'cost.manage'" class="col-md-3 cost-panel-action">
      <button
        type="button"
        class="btn btn-outline-primary w-100"
        data-testid="item-save"
        [disabled]="saving()"
        (click)="save()"
      >
        Simpan
      </button>
    </div>
  </div>
  <app-cost-panel [itemId]="itemId()" (itemChange)="show($event)" />
</div>
