<div class="show-box">
  <div class="selection-box">
    <select
      class="form-control table-page-size"
      [value]="state.tableData['paginate']"
      [attr.aria-label]="'items_per_page' | translate"
      [title]="'items_per_page' | translate"
      (change)="state.onChangeTable($event, 'paginate')"
    >
      @for (item of state.rows; track item) {
        <option [value]="item">{{ item }}</option>
      }
    </select>
    @if (canDeleteSelected()) {
      <a
        href="javascript:void(0)"
        class="align-items-center btn btn-light-bg btn-sm d-flex"
        (click)="deleteSelected.emit()"
      >
        <i [class]="'ri-delete-bin-line'"></i> {{ 'delete' | translate }}
      </a>
    }
    @if (canDuplicateSelected()) {
      <a
        href="javascript:void(0)"
        class="align-items-center btn btn-light-bg btn-sm d-flex"
        (click)="
          duplicateSelected.emit();
          $event.preventDefault();
          $event.stopPropagation()
        "
      >
        <i [class]="'ri-file-copy-line'"></i> {{ 'duplicate' | translate }}
      </a>
    }
  </div>
  <div class="role-search">
    @if (dateRange()) {
      <div class="dp-hidden position-absolute custom-dp-dropdown">
        <div class="input-group">
          <input
            name="datepicker"
            class="form-control"
            ngbDatepicker
            #datepicker="ngbDatepicker"
            [autoClose]="'outside'"
            (dateSelect)="state.onDateSelection($event)"
            [displayMonths]="2"
            [dayTemplate]="t"
            outsideDays="hidden"
            [startDate]="state.fromDate!"
            [footerTemplate]="footerTemplate"
            id="start_date"
            tabindex="-1"
            readonly
          />
          <ng-template #t let-date let-focused="focused">
            <span
              class="custom-day"
              [class.focused]="focused"
              [class.range]="state.isRange(date)"
              [class.faded]="state.isHovered(date) || state.isInside(date)"
              (mouseenter)="state.hoveredDate = date"
              (mouseleave)="state.hoveredDate = null"
            >
              {{ date.day }}
            </span>
          </ng-template>
        </div>
      </div>
      <div class="search-input">
        <div class="input-group custom-dt-picker">
          <input
            #dpFromDate
            class="form-control"
            placeholder="{{ 'yyyy-mm-dd' | translate }}"
            name="dpFromDate"
            [value]="state.formatter.format(state.fromDate)"
            id="end_date"
            (input)="
              state.fromDate = state.validateInput(
                state.fromDate,
                dpFromDate.value
              )
            "
            readonly
          />
          <button
            class="btn btn-light-bg-secondary"
            (click)="datepicker.toggle()"
            type="button"
          >
            <i class="ri-calendar-line"></i>
          </button>
        </div>

        <div class="input-group custom-dt-picker">
          <input
            #dpToDate
            class="form-control"
            placeholder="{{ 'yyyy-mm-dd' | translate }}"
            name="dpToDate"
            [value]="state.formatter.format(state.toDate)"
            (input)="
              state.toDate = state.validateInput(state.toDate, dpToDate.value)
            "
            readonly
          />
          <button
            class="btn btn-light-bg-secondary"
            (click)="datepicker.toggle()"
            type="button"
          >
            <i class="ri-calendar-line"></i>
          </button>
        </div>
      </div>

      <ng-template #footerTemplate>
        <hr class="my-0" />
        <button
          class="btn btn-primary btn-sm m-2 float-start"
          (click)="state.clearDateRange(); datepicker.close()"
        >
          {{ 'clear' | translate }}
        </button>
        <button
          class="btn btn-secondary btn-sm m-2 float-end"
          (click)="datepicker.close()"
        >
          {{ 'close' | translate }}
        </button>
      </ng-template>
    }
    <div class="role-search product-search table-search w-auto">
      <i class="ri-search-line" aria-hidden="true"></i>
      <input
        type="search"
        class="form-control"
        id="role-search"
        [placeholder]="'search' | translate"
        [attr.aria-label]="'search' | translate"
        [formControl]="state.term"
      />
    </div>
    <ng-content select="[filter]" />

    <!-- Tools: reload, reset, import and export (not built yet). -->
    <div class="table-tools">
      <button
        type="button"
        class="btn btn-light-bg table-tool"
        [disabled]="state.toolsCoolingDown"
        [ngbTooltip]="'table_reload' | translate"
        [attr.aria-label]="'table_reload' | translate"
        (click)="state.reloadTable()"
      >
        <i class="ri-refresh-line"></i>
      </button>
      <button
        type="button"
        class="btn btn-light-bg table-tool"
        [disabled]="state.toolsCoolingDown"
        [ngbTooltip]="'table_reset' | translate"
        [attr.aria-label]="'table_reset' | translate"
        (click)="state.resetTable()"
      >
        <i class="ri-restart-line"></i>
      </button>
      <span [ngbTooltip]="'table_import_soon' | translate">
        <button
          type="button"
          class="btn btn-light-bg table-tool"
          disabled
          [attr.aria-label]="'table_import_soon' | translate"
        >
          <i class="ri-upload-2-line"></i>
        </button>
      </span>
      <span [ngbTooltip]="'table_export_soon' | translate">
        <button
          type="button"
          class="btn btn-light-bg table-tool"
          disabled
          [attr.aria-label]="'table_export_soon' | translate"
        >
          <i class="ri-download-2-line"></i>
        </button>
      </span>
    </div>
  </div>
</div>
