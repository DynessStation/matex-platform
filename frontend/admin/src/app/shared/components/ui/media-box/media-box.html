<div class="select-top-panel">
  <div>
    <input
      type="text"
      class="form-control"
      [placeholder]="'media_ui.search_files' | translate"
      [formControl]="term"
    />
  </div>

  <select class="form-select" (change)="onMediaChange($event)">
    <option value="">
      {{ 'media_ui.sort_default' | translate }}
    </option>

    <option value="newest">
      {{ 'media_ui.sort_newest' | translate }}
    </option>

    <option value="oldest">
      {{ 'media_ui.sort_oldest' | translate }}
    </option>

    <option value="smallest">
      {{ 'media_ui.sort_smallest' | translate }}
    </option>

    <option value="largest">
      {{ 'media_ui.sort_largest' | translate }}
    </option>
  </select>
</div>

<div
  class="content-section select-file-section py-0 ratio2_3 custom-box-loader"
>
  @if (loading) {
    <div class="box-loader">
      <app-loader [loaderClass]="'custom-loader-wrapper'" />
    </div>
  } @else {
    @if ((attachment$ | async)?.data?.length) {
      <div
        class="row row-cols-xxl-6 row-cols-xl-5 row-cols-lg-4 row-cols-sm-3 row-cols-2 g-sm-3 g-2 media-library-sec ratio_square"
      >
        @for (
          attachment of (attachment$ | async)?.data;
          track attachment.id_attachment
        ) {
          <div>
            <div class="library-box">
              <input
                [type]="!multiple() ? 'radio' : 'checkbox'"
                [checked]="
                  selected.includes(attachment.id_attachment) ||
                  selected.includes(attachment.asset_url)
                "
                name="attachment"
                [value]="attachment.id_attachment"
                class="media-checkbox"
                [id]="'attachment-' + attachment.id_attachment"
                (change)="selectImage($event, attachment, url())"
              />

              <label [for]="'attachment-' + attachment.id_attachment">
                <div class="ratio ratio-1x1">
                  @if (
                    attachment.mime_type &&
                    attachment.mime_type.startsWith('image')
                  ) {
                    <img
                      [src]="attachment.asset_url"
                      class="img-fluid"
                      [alt]="attachment.name || attachment.original_name"
                      loading="lazy"
                    />
                  } @else {
                    <img
                      [src]="getMimeTypeImage(attachment.mime_type)"
                      class="img-fluid"
                      [alt]="attachment.name"
                    />
                  }
                </div>
              </label>

              @if (deleteAction()) {
                <button
                  *hasPermission="'attachment.delete'"
                  type="button"
                  class="media-delete-btn"
                  [title]="'media_ui.delete' | translate"
                  (click)="
                    $event.stopPropagation();
                    DeleteModal()?.openModal('delete', attachment)
                  "
                >
                  <i class="ri-delete-bin-line"></i>
                </button>
              }
            </div>
          </div>
        }
      </div>
    }
  }

  @if ((attachment$ | async)?.data?.length) {
    <nav class="custom-pagination">
      <app-pagination
        [total]="totalItems"
        [currentPage]="filter['page']"
        [pageSize]="filter['paginate']"
        (setPage)="setPaginate($event)"
      />
    </nav>
  }

  @if (!(attachment$ | async)?.data?.length && !loading) {
    <app-no-data
      [image]="'assets/svg/no-media_ui.png'"
      [text]="'media_ui.no_media_found' | translate"
    />
  }
</div>

<app-delete-modal
  #deleteModal
  (deleteItem)="onActionClicked($event.actionToPerform, $event.data)"
/>
