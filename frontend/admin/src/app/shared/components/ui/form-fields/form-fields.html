<div [class]="class()">
  <label [attr.for]="for()" [class]="labelClass()">
    {{ label() | translate }}
    @if (required()) {
      <span class="theme-color ms-2 required-dot">*</span>
    }
    @if (help()) {
      <app-help-tip [page]="helpPage()" [section]="help()" />
    }
  </label>
  <div [class]="gridClass()">
    <ng-content />
  </div>
</div>
