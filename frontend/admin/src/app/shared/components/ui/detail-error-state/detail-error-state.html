<div
  class="d-flex flex-column align-items-center justify-content-center text-center py-5 px-3"
>
  <i [class]="state().icon + ' fs-1 text-muted mb-3'"></i>

  <h4 class="mb-2">
    {{ state().title | translate }}
  </h4>

  <p class="text-muted mb-4 mw-100">
    {{ state().message | translate }}
  </p>

  <div class="d-flex flex-wrap justify-content-center gap-2">
    @if (state().canRetry) {
      <button type="button" class="btn btn-theme" (click)="onRetry()">
        <i class="ri-refresh-line me-1"></i>

        {{ 'detail_state.retry' | translate }}
      </button>
    }

    <a class="btn btn-light-bg" [routerLink]="backUrl()">
      <i class="ri-arrow-left-line me-1"></i>

      {{ 'detail_state.back' | translate }}
    </a>
  </div>
</div>
