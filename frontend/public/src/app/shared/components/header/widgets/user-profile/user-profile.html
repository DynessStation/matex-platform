<a (click)="account()">
  <i class="iconsax" icon-name="user-2"></i>
</a>

  <ul class="dropdown-list user-dropdown">
    <li>
      <a (click)="openLoginModal()">Log In</a>

    <app-login-modal #loginModal />

    <li>
      <span>New customer?</span>
      <a href="javascript:void(0)" class="btn signup-btn" (click)="goToRegister()">Start here.</a>
    </li>
  </ul>
}
