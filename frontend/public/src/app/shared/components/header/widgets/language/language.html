<div class="dropdown theme-form-select" (clickOutside)="hideDropdown()">
  <button class="btn dropdown-toggle" type="button" (click)="openDropDown()">
    <img [src]="selectedLanguage.icon" class="img-fluid" alt="image" />
    <span>{{ selectedLanguage.language }}</span>
  </button>

  <ul class="dropdown-menu dropdown-menu-end" [class.show]="active">
    @for (language of languages; track language.language) {
      <li>
        <a
          class="dropdown-item"
          href="javascript:void(0)"
          (click)="selectLanguage(language)"
          [class.active]="language.code === selectedLanguage.code"
        >
          <img [src]="language.icon" class="img-fluid" alt="image" />
          <span> {{ language.language }}</span>
        </a>
      </li>
    }
  </ul>
</div>
