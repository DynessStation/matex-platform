<div class="dropdown theme-form-select" (clickOutside)="hideDropdown()">
  <button class="btn dropdown-toggle" type="button" (click)="openDropDown()">
    <span class="language-flag">{{ navigation.locale() === 'en-US' ? '🇺🇸' : '🇮🇩' }}</span>
    <span>{{ navigation.locale() === 'en-US' ? 'English' : 'Indonesia' }}</span>
  </button>

  <ul class="dropdown-menu dropdown-menu-end" [class.show]="active">
    <li>
      <button
        class="dropdown-item"
        type="button"
        (click)="selectLocale('id-ID')"
        [class.active]="navigation.locale() === 'id-ID'"
      >
        <span class="language-flag">🇮🇩</span><span>Indonesia</span>
      </button>
    </li>
    <li>
      <button
        class="dropdown-item"
        type="button"
        (click)="selectLocale('en-US')"
        [class.active]="navigation.locale() === 'en-US'"
      >
        <span class="language-flag">🇺🇸</span><span>English</span>
      </button>
    </li>
  </ul>
</div>
