<div class="dropdown theme-form-select" (clickOutside)="hideDropdown()">
  <button class="btn dropdown-toggle" type="button" (click)="openDropDown()">
    <img
      [src]="
        navigation.locale() === 'en-US'
          ? 'assets/images/country/us.svg'
          : 'assets/images/country/id.svg'
      "
      class="img-fluid"
      alt="image"
    />
    <span>{{ navigation.locale() === 'en-US' ? 'English' : 'Indonesia' }}</span>
  </button>

  <ul class="dropdown-menu dropdown-menu-end" [class.show]="active">
    <li>
      <button
        class="dropdown-item"
        type="button"
        (click)="selectLocale('id-ID')"
        [class.active]="navigation.locale() === 'id-ID'"
      >
        <img src="assets/images/country/id.svg" class="img-fluid" alt="image" /><span>Indo</span>
      </button>
    </li>
    <li>
      <button
        class="dropdown-item"
        type="button"
        (click)="selectLocale('en-US')"
        [class.active]="navigation.locale() === 'en-US'"
      >
        <img src="assets/images/country/us.svg" class="img-fluid" alt="image" /><span>English</span>
      </button>
    </li>
  </ul>
</div>
