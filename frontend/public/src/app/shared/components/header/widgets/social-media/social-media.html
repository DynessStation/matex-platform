@if (socials$ | async; as socials) {
  @if (socials.length) {
    <ul class="social-list" data-testid="header-socials">
      @for (social of socials; track social.key) {
        <li>
          <a
            target="_blank"
            rel="noopener noreferrer"
            [href]="social.url"
            [attr.aria-label]="social.name"
            [attr.data-track]="'social:' + social.key"
          >
            <i [class]="icon(social.platform)"></i>
          </a>
        </li>
      }
    </ul>
  }
}
