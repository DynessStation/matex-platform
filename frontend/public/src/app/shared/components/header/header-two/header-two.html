<header class="header-style-1" [ngClass]="stick && sticky() ? 'sticky-header' : ''">
  <div class="top-header-banner" [style.display]="showHeaderBanner ? 'block' : 'none'">
    <img src="assets/images/header/1.jpg" class="img-fluid" alt="image" />
    <button class="btn close-btn banner-remove" (click)="removeHeaderBanner()">
      <i class="ri-close-fill"></i>
    </button>
  </div>

  <div class="main-header main-header-theme-color custom-container">
    <div class="left-header">
      <button
        class="navbar-toggler d-xl-none d-inline navbar-menu-button"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#primaryMenu"
      >
        <span class="navbar-toggler-icon">
          <i class="ri-menu-line" (click)="mainMenuOpen()"></i>
        </span>
      </button>
      <app-logo [logo]="logo()"></app-logo>
    </div>
    <div
      class="middle-header searchInput"
      id="searchOffcanvas"
      [class.show]="menuService.isOpenSearch"
    >
      <app-search></app-search>
    </div>

    <div class="right-header">
      <ul class="header-icon">
        <li>
          <a href="javascript:void(0)" id="searchClick" (click)="searchOpen()">
            <i class="iconsax search-btn" icon-name="search-normal-2"></i>
          </a>
        </li>
        <li class="contact-list">
          <a href="tel:+19173768944">
            <i class="iconsax" icon-name="phone-ringing"></i>
            <div>
              <h6>Call us now</h6>
              <h5>+1 917 376 8944</h5>
            </div>
          </a>
        </li>
        <li class="dropdown-box">
          <app-user-profile />
        </li>
        <li>
          <a (click)="openWishlist()">
            <i class="iconsax" icon-name="heart"></i>
          </a>
          <ng-template #wishlistOffcanvas>
            <div class="offcanvas-header">
              <h4>Wishlist</h4>
              <button class="btn close-btn" (click)="closeWishlist()">
                <i class="ri-close-fill"></i>
              </button>
            </div>
            <app-wishlist [type]="'wishlistOffcanvas'"></app-wishlist>
          </ng-template>
        </li>
        <li>
          <app-cart></app-cart>
        </li>
      </ul>
    </div>
  </div>

  <div class="nav-light-header custom-container d-flex">
    <div class="category-header">
      <span
        class="btn bg-color category-button rounded-0 d-sm-block d-none"
        (click)="toggleCategories()"
      >
        <i class="ri-menu-line"></i>
        <span>Shop By Categories</span>
      </span>
      <button class="btn bg-color category-button rounded-0 d-none" (click)="toggleCategories()">
        <i class="ri-menu-line"></i>
        <span>Shop By Categories</span>
      </button>
      @if (layoutService.headerCategoryCanvasToggle) {
        <div
          class="category-fixed-box offcanvas offcanvas-start"
          [class.show]="layoutService.headerCategoryCanvasToggle"
        >
          <app-home-category [type]="'category_list'"></app-home-category>
        </div>
        <div
          (click)="toggleCategories()"
          class="offcanvas-backdrop fade"
          [class.show]="layoutService.headerCategoryCanvasToggle"
        ></div>
      }
    </div>

    <div class="header-nav-middle">
      <app-main-menu [navClass]="'navbar-nav-dark'"></app-main-menu>
    </div>

    <div class="recent-light-header d-sm-flex d-none">
      <ul class="product-viwer">
        <li class="order-tracking d-xxl-inline-block d-none">
          <a [routerLink]="['/order/tracking']" class="product-link">Order Tracking</a>
        </li>
      </ul>
    </div>
  </div>
</header>
