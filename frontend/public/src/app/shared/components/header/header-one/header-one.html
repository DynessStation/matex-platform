<header class="header-style-1" [ngClass]="stick ? 'sticky-header' : ''">
  <div class="top-header custom-container">
    <div class="left-header">
      <div class="dropdown-box">
        <ul>
          <li>
            <app-language />
          </li>
        </ul>
      </div>
    </div>

    <div class="middle-header">
      <div class="middle-content">
        <p>PT Matex Indo Abadi</p>
      </div>
    </div>

    <div class="right-header"></div>
  </div>

  <div class="main-header custom-container">
    <div class="left-header">
      <button
        class="navbar-toggler d-xl-none d-inline navbar-menu-button"
        type="button"
        aria-label="Open navigation"
        (click)="mainMenuOpen()"
      >
        <span class="navbar-toggler-icon">
          <i class="ri-menu-line"></i>
        </span>
      </button>

      <app-logo [logo]="'assets/images/logo/1.svg'" [homePath]="navigation.homePath()" />
    </div>
  </div>

  <div class="nav-header custom-container d-flex">
    <div class="category-header d-sm-flex d-none">
      <button class="btn category-button" type="button" (click)="mainMenuOpen()">
        <i class="ri-menu-line"></i>
        <span>Menu</span>
      </button>
    </div>

    <div class="header-nav-middle">
      <app-main-menu [items]="navigation.primaryItems()" />
    </div>
  </div>
</header>
