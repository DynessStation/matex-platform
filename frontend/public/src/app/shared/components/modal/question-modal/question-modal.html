<div class="modal-header">
  <h3 class="modal-title">{{ 'Ask a question' | translate }}</h3>
  <app-button
    [class]="'btn btn-close'"
    [id]="'profile_modal_close_btn'"
    (click)="modal.close('Cross click')"
    [iconClass]="'ri-close-line'"
  >
  </app-button>
</div>

<div class="modal-body">
  <form class="product-review-form">
    <div class="product-wrapper">
      <div class="product-image">
        <img
          [src]="
            product.product_thumbnail
              ? product.product_thumbnail.asset_url
              : 'assets/images/placeholder/product.png'
          "
          class="img-fluid"
          [alt]="product.name"
        />
      </div>
      <div class="product-content">
        <h4 class="name">{{ product.name }}</h4>
        <h5 class="price-number">${{ product.sale_price }}</h5>
      </div>
    </div>

    <div class="review-box form-box">
      <label class="form-label" for="content">{{ 'Your Questions' | translate }} *</label>
      <textarea
        placeholder="{{ 'Your Questions' | translate }}"
        class="form-control"
        id="content"
        rows="3"
        [formControl]="question"
      ></textarea>
    </div>
  </form>
</div>
<div class="modal-footer">
  <app-button
    [class]="'btn theme-border fw-500'"
    [type]="'button'"
    [id]="'cancel_profile_btn'"
    (click)="modal.dismiss('Cancel')"
    [spinner]="false"
  >
    {{ 'Cancel' | translate }}
  </app-button>
  <app-button [class]="'btn apply-btn btn-bg-theme'" [id]="'submit_profile_btn'" (click)="submit()">
    {{ 'Submit' | translate }}
  </app-button>
</div>
