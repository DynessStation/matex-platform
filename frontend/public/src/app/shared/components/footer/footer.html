<footer class="footer-section">
  <div class="custom-container">
    <div class="main-footer">
      <div class="row g-sm-4 g-3">
        <div class="col-xl-4 col-md-6">
          <app-footer-logo
            [logo]="'assets/images/logo/1-dark.svg'"
            [homePath]="navigation.homePath()"
          />

          <p class="mt-3 mb-0">PT Matex Indo Abadi</p>
        </div>

        <div class="col-xl-3 col-md-6">
          <div class="footer-title">
            <h4>Menu</h4>
          </div>

          <div class="footer-content">
            <ul>
              <ng-container
                *ngTemplateOutlet="footerMenu; context: { $implicit: navigation.primaryItems() }"
              />
            </ul>
          </div>
        </div>
      </div>
    </div>

    <div class="sub-footer">
      <p>© {{ year }} PT Matex Indo Abadi</p>
    </div>
  </div>
</footer>

<ng-template #footerMenu let-items>
  @for (item of items; track item.key) {
    <li>
      @if (item.link_type === 'external' && item.url) {
        <a
          [href]="item.url"
          [attr.target]="item.target_blank ? '_blank' : null"
          [attr.rel]="item.target_blank ? 'noopener noreferrer' : null"
        >
          {{ item.label }}
        </a>
      } @else if (item.path) {
        <a [routerLink]="item.path">{{ item.label }}</a>
      } @else {
        <span>{{ item.label }}</span>
      }

      @if (item.children.length) {
        <ul>
          <ng-container *ngTemplateOutlet="footerMenu; context: { $implicit: item.children }" />
        </ul>
      }
    </li>
  }
</ng-template>
