@if (productBoxStyle() === 'product_box_one') {
  <app-product-box-one [product]="product()"></app-product-box-one>
} @else {
  <div class="product-box productMain">
    <a [routerLink]="['/product', product()?.slug]" class="product-image">
      <img
        [src]="product()?.product_thumbnail?.asset_url || 'assets/images/placeholder/product.png'"
        class="img-fluid productImage"
        [alt]="product()?.name"
      />
    </a>
    <div class="product-content">
      <a [routerLink]="['/product', product()?.slug]">
        <h5 class="productName">{{ product()?.name }}</h5>
      </a>
      <ngb-rating [rate]="product()?.rating_count!" class="rating">
        <ng-template let-fill="fill" let-index="index">
          <i class="ri-star-fill" [class.filled]="fill === 100"></i>
        </ng-template>
      </ngb-rating>
      <h5 class="price">
        {{ product() | productPrice }}
        <del>{{ product() | productPrice: 'compare' }}</del>
      </h5>
      <div class="progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated"></div>
      </div>
      <h5 class="sold">Sold : 4/12</h5>
    </div>
    <div class="compare-box">
      <app-product-cart-button [product]="product()" [type]="'addCart'" />
      <ul class="compare-list">
        <li>
          <app-wishlist [product]="product()" [class]="'wishlistProduct'" />
        </li>
        <li>
          <button class="btn">
            <i class="ri-repeat-2-line"></i>
            <span>Compare</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
}
