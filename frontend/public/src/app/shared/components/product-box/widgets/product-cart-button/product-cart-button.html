@if (type() === 'wishlist') {
  <button
    class="btn cart-btn"
    type="button"
    (click)="addToCart(product()!, 1)"
    [attr.aria-label]="isEnglish ? 'Add product to cart' : 'Tambahkan produk ke keranjang'"
  >
    <span>{{ isEnglish ? 'Add to cart' : 'Tambah ke keranjang' }}</span>
  </button>
}
@if (type() === 'addCart') {
  <button [class]="class()" type="button" (click)="addToCart(product()!, 1)">
    {{ isEnglish ? 'Add to cart' : 'Tambah ke keranjang' }}
  </button>
}
