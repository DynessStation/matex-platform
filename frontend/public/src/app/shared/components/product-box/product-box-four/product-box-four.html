<div class="product-kid-box productMain">
  <div class="product-image-box">
    <a [routerLink]="['/product/' + product()?.slug]" class="image-box">
      <img [src]="product()?.product_thumbnail?.asset_url!" class="img-fluid productImage" alt="" />
    </a>
    <ul class="product-option">
      <li>
        <app-wishlist [product]="product()" [class]="'wishlistProduct'" />
      </li>
      <li>
        <app-compare [product]="product()!" />
      </li>
    </ul>
    <app-quick-view [product]="product()" [quickViewStyle]="'text'" />
  </div>

  <div class="product-content">
    <h5 class="name productName">
      <a [routerLink]="['/product', product()?.slug]">{{ product()?.name }}</a>
    </h5>
    <h5 class="price">
      {{ product()?.sale_price | currencySymbol }}
      <del>{{ product()?.price | currencySymbol }}</del>
    </h5>
    <ul class="rating">
      <ngb-rating [rate]="product()?.rating_count!">
        <ng-template let-fill="fill" let-index="index">
          <i class="ri-star-fill" [class.filled]="fill === 100"></i>
        </ng-template>
      </ngb-rating>
    </ul>
  </div>
</div>
