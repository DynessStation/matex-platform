@if (routeLoading() || themeOptionService.preloader()) {
  <app-loader [label]="loadingLabel" />
} @else if (requestLoading()) {
  <app-loader loaderClass="request-loader" [label]="requestLoadingLabel" />
}
<app-header [logo]="headerLogo"></app-header>
<main id="main-content">
  <router-outlet></router-outlet>
</main>
<app-footer [logo]="footerLogo"></app-footer>
<app-back-to-top />
