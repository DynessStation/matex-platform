<!-- Account and other market pages (P-1): the same text as the header "Segera" panel. -->
<section class="v2-page">
  <div class="v2-card">
    <a
      [routerLink]="homePath"
      class="matex-logo"
      [attr.aria-label]="isEnglish ? 'MATEX home' : 'Beranda MATEX'"
    >
      <img src="assets/images/logo/1.svg" alt="MATEX" />
    </a>

    <span class="version-label">{{ text.badge }}</span>
    <h1>{{ text.title }}</h1>
    <p>{{ text.body }}</p>

    <ul class="market-features">
      @for (feature of features; track feature) {
        <li>
          <i class="iconsax" [attr.icon-name]="icons[feature]" aria-hidden="true"></i>
          {{ text.features[feature] }}
        </li>
      }
    </ul>

    <div class="market-actions">
      @if (whatsapp$ | async; as whatsapp) {
        <a [href]="whatsapp" target="_blank" rel="noopener" class="back-home">
          <i class="ri-whatsapp-line" aria-hidden="true"></i>
          {{ text.whatsapp }}
        </a>
      } @else {
        <a [routerLink]="contactPath" class="back-home">{{ text.contact }}</a>
      }
      <a [routerLink]="catalogPath" class="secondary-link">{{ text.catalog }}</a>
    </div>
  </div>
</section>
