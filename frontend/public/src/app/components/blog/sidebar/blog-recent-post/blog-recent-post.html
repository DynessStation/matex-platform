<div class="recent-post-box">
  @for (blog of blogs() | slice: 0 : 5; track blog.id) {
    <div class="recent-box">
      <a [routerLink]="['/blog/', blog?.slug]" class="recent-image">
        <img
          [src]="blog.blog_thumbnail ? blog.blog_thumbnail.asset_url : 'assets/images/blog.png'"
          [alt]="blog.title"
          class="img-fluid"
          alt="image"
        />
      </a>
      <div class="recent-detail">
        <a [routerLink]="['/blog/', blog?.slug]">
          <h5 class="recent-name">{{ blog.title }}</h5>
        </a>
        <p>{{ blog?.created_at | date: 'dd MMM yyyy hh:mm:a' }}</p>
      </div>
    </div>
  }
</div>
