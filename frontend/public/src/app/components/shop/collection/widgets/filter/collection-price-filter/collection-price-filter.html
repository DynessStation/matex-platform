<ul class="category-list custom-padding custom-height">
  @for (price of prices; track price) {
    <li>
      <div class="form-check collection-filter-checkbox">
        <input
          type="checkbox"
          class="form-check-input checkbox_animated"
          id="price-filter{{ price?.id }}"
          [value]="price?.value"
          [checked]="checked(price?.value!)"
          (change)="applyFilter($event)"
        />
        <label class="form-check-label" for="price-filter{{ price?.id }}">
          <span class="name">{{ priceLabel(price) }}</span>
        </label>
      </div>
    </li>
  }
</ul>
