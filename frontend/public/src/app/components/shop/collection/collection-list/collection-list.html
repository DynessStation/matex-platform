<!-- Recent Viewed Product Section Start -->
<section class="section-t-space recent-product-section">
  <div class="custom-container">
    <app-collection-categories></app-collection-categories>
  </div>
</section>
<!-- Recent Viewed Product Section End -->

<!-- Shop Section Start -->
<section class="section-t-space shop-section">
  <div class="custom-container">
    <div class="row">
      <div class="col-custom-3">
        <div class="left-box" [class.show]="layoutService.offCanvasFilterMenu">
          <app-collection-sidebar [filter]="filter()"></app-collection-sidebar>
        </div>
      </div>

      <div class="col-custom-9">
        <app-collection-products
          [productClass]="'pro-bg-white'"
          [filter]="filter()"
        ></app-collection-products>
      </div>
    </div>
  </div>
</section>
<!-- Shop Section End -->
